name: TERRAFORMRG

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  my_terraform:
    name: create RG
    runs-on: ubuntu-20.04

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


